name: "CI"

on:
    pull_request:
    push:
        branches:
            - 'master'

env:
    fail-fast: true
    PHPUNIT_FLAGS: "-v"
    XDEBUG_MODE: "coverage"

jobs:
    test:
        name: PHP ${{ matrix.php-version }} + Symfony ${{ matrix.symfony-version }}
        runs-on: 'ubuntu-latest'
        continue-on-error: ${{ matrix.allowed-to-fail }}

        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
                dependencies: [highest]
                allowed-to-fail: [false]
                symfony-version: ['6.4', '7.4', '8.1']
                exclude:
                  - php-version: '8.2'
                    symfony-version: '8.1'
                  - php-version: '8.3'
                    symfony-version: '8.1'
                include:
                  - php-version: nightly
                    dependencies: highest
                    allowed-to-fail: true
                    symfony-version: '8.1'
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v6

            - name: "Install PHP with extensions"
              uses: shivammathur/setup-php@v2
              with:
                  coverage: xdebug
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2
                  extensions: intl, xdebug

            - name: "Select Symfony ${{ matrix.symfony-version }} components"
              env:
                  SYMFONY_VERSION: ${{ matrix.symfony-version }}
              run: |
                  php <<'PHP'
                  <?php
                  $composer = json_decode(file_get_contents('composer.json'), true, 512, JSON_THROW_ON_ERROR);
                  foreach (['require', 'require-dev'] as $section) {
                      foreach ($composer[$section] as $package => $constraint) {
                          if (str_starts_with($package, 'symfony/')) {
                              $composer[$section][$package] = getenv('SYMFONY_VERSION').'.*';
                          }
                      }
                  }
                  file_put_contents('composer.json', json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)."\n");
                  PHP

            - name: "Install Composer dependencies (${{ matrix.dependencies }})"
              uses: "ramsey/composer-install@v3"
              with:
                dependency-versions: "${{ matrix.dependencies }}"
                composer-options: "--prefer-dist"

            - name: "Show installed Symfony versions"
              run: composer show 'symfony/*'

            - name: "Install PHPUnit"
              run: vendor/bin/simple-phpunit install

            - name: "PHPUnit version"
              run: vendor/bin/simple-phpunit --version

            - name: "Run unit tests"
              run: vendor/bin/phpunit --coverage-text --verbose

    test_js:
        name: JS tests
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout code"
              uses: actions/checkout@v6

            - name: "Setup node"
              uses: actions/setup-node@v4
              with:
                  node-version: 'lts/*'

            - name: "Install dependencies"
              run: npm install
              working-directory: Resources

            - name: "Run tests"
              run: npm test
              working-directory: Resources
